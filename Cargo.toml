[package]
name = "ccswitch"
version = "0.1.0"
edition = "2021"
description = "Switch between isolated Claude Code profiles (work, personal, ...) from one command"
authors = ["Mostafa Elgazar"]
license = "MIT"
repository = "https://github.com/mostafaelgazar48/ccswitch"
homepage = "https://github.com/mostafaelgazar48/ccswitch"
readme = "README.md"
keywords = ["claude", "claude-code", "profiles", "cli", "accounts"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/dist", "/.github"]

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "7"
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
