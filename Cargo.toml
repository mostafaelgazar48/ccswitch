[package]
name = "ccswitch"
version = "0.2.0"
edition = "2021"
description = "Switch between isolated Claude Code profiles from one command"
authors = ["Mostafa Elgazar"]
license = "MIT"
repository = "https://github.com/mostafaelgazar48/ccswitch"
homepage = "https://github.com/mostafaelgazar48/ccswitch"
readme = "README.md"
keywords = ["claude", "claude-code", "profiles", "cli", "accounts"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/dist", "/.github"]

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "Mostafa Elgazar <mostafaelgazar4897@gmail.com>"
copyright = "2026, Mostafa Elgazar"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
depends = ""
extended-description = """\
ccswitch keeps several Claude Code logins side by side. Each profile is its own \
CLAUDE_CONFIG_DIR, so accounts, settings and history never mix. Requires Claude Code."""
assets = [
    ["target/release/ccswitch", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/ccswitch/README.md", "644"],
]
