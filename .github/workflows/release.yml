name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to publish a release.
# Run it manually from the Actions tab to build and test every package without publishing.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Tag matches Cargo.toml
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: [check-version, ci]
    # check-version is skipped on manual runs; build anyway unless something failed.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install cargo-deb
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          target="${{ matrix.target }}"
          bin="target/$target/release/ccswitch"
          mkdir pkg out
          cp README.md LICENSE pkg/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$bin.exe" pkg/
            (cd pkg && 7z a "../out/ccswitch-$target.zip" ccswitch.exe README.md LICENSE)
            cp "$bin.exe" "out/ccswitch-$target.exe"
          else
            cp "$bin" pkg/
            tar czf "out/ccswitch-$target.tar.gz" -C pkg ccswitch README.md LICENSE
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            mkdir macbin && cp "$bin" "macbin/ccswitch-$target"
          fi

      - name: Package .deb
        if: runner.os == 'Linux'
        run: cargo deb --no-build --no-strip --target ${{ matrix.target }} --output out/

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1
          }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          & $iscc.FullName "/DAppVersion=$version" "/DSourceExe=$PWD\target\${{ matrix.target }}\release\ccswitch.exe" "/O$PWD\out" packaging\windows\ccswitch.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem out\*-setup.exe | Select-Object -First 1
          $dir = "$env:LOCALAPPDATA\Programs\ccswitch"
          function UserPath { [Environment]::GetEnvironmentVariable('Path', 'User') }
          function Count { @((UserPath) -split ';' | Where-Object { $_ -eq $dir }).Count }

          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          & "$dir\ccswitch.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "ccswitch.exe did not run" }
          if ((Count) -ne 1) { throw "install folder not on user PATH: $(UserPath)" }

          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          if ((Count) -ne 1) { throw "reinstall duplicated the PATH entry: $(UserPath)" }

          # The uninstaller relaunches itself from a temp folder, so -Wait returns early; poll instead.
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          for ($i = 0; $i -lt 60 -and ((Test-Path "$dir\ccswitch.exe") -or (Count) -ne 0); $i++) { Start-Sleep -Milliseconds 500 }
          if ((Count) -ne 0) { throw "uninstall left the PATH entry: $(UserPath)" }
          if (Test-Path "$dir\ccswitch.exe") { throw "uninstall left ccswitch.exe behind" }
          Write-Host "Installer OK"

      - name: Checksums
        shell: bash
        run: |
          cd out
          for f in *; do
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macbin-${{ matrix.target }}
          path: macbin/*
          if-no-files-found: error

  dmg:
    name: Build macOS .dmg
    needs: build
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: macbin-*
          path: macbin
          merge-multiple: true
      - run: sh packaging/macos/build-dmg.sh macbin/ccswitch-aarch64-apple-darwin macbin/ccswitch-x86_64-apple-darwin out
      - name: Test .dmg
        run: |
          dmg=$(ls out/*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          ls -la "$mnt"
          archs=$(lipo -archs "$mnt/ccswitch")
          echo "architectures: $archs"
          case "$archs" in *x86_64*arm64* | *arm64*x86_64*) ;; *) echo "not universal"; exit 1 ;; esac
          "$mnt/ccswitch" --version
          test -x "$mnt/Install ccswitch.command"
          hdiutil detach "$mnt"
      - name: Checksums
        run: cd out && for f in *; do shasum -a 256 "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-dmg
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, dmg]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Write checksums and release notes
        run: |
          (cd dist && cat ./*.sha256 > SHA256SUMS)
          version="${GITHUB_REF_NAME#v}"
          # Notes come from this version's section in CHANGELOG.md.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^(## \[|\[[^]]+\]: )/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::warning::No CHANGELOG.md section for $version"; fi
          cat notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [ -s notes.md ] && flags+=(--notes-file notes.md) || flags+=(--generate-notes)
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "ccswitch ${GITHUB_REF_NAME#v}" --verify-tag "${flags[@]}"
